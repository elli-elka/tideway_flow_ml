name: EA Richmond Tidal Levels Ingest

on:
  schedule:
    - cron: "23 6 * * *"   # off the top of the hour, when GitHub drops/delays fewer scheduled runs
  workflow_dispatch:        # "Run workflow" button; optionally backfill from a date
    inputs:
      since:
        description: "Backfill from this date (YYYY-MM-DD). Leave empty for a normal incremental run."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run ingestion script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python ingest_ea_levels.py "${{ inputs.since }}"
