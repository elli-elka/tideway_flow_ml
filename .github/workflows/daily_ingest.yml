name: Richmond Levels, Flags, Predictions & App Feed

on:
  schedule:
    - cron: "23 */6 * * *"   # off the top of the hour, when GitHub drops/delays fewer scheduled runs
  workflow_dispatch:        # "Run workflow" button; optionally backfill from a date
    inputs:
      since:
        description: "Backfill from this date (YYYY-MM-DD). Leave empty for a normal incremental run."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: pipeline

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-ml.txt

      - name: Run ingestion script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python ingest_ea_levels.py "${{ inputs.since }}"

      - name: Rebuild ebb tide flag history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RICHMOND_CD_OFFSET: ${{ vars.RICHMOND_CD_OFFSET }}
          PYTHONUNBUFFERED: "1"
        run: |
          python build_ebb_flags.py

      - name: Predict flags for the next 7 days
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python predict_flags.py

      - name: Build app feed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python publish_app_feed.py site

      - name: Upload app feed
        uses: actions/upload-pages-artifact@v4
        with:
          path: pipeline/site

  # Publishes feed.json to https://<user>.github.io/<repo>/feed.json for the iOS app.
  # Needs Settings -> Pages -> Source: "GitHub Actions".
  deploy-feed:
    needs: ingest
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
