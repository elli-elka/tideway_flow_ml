name: Catchment Rainfall (Open-Meteo) Ingest

on:
  schedule:
    - cron: "11 5 * * *"   # off the top of the hour, when GitHub drops/delays fewer scheduled runs
  workflow_dispatch:        # "Run workflow" button (first run backfills history from 2005)

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: pipeline

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run ingestion script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python ingest_catchment_rain.py
