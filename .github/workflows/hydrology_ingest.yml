name: EA Hydrology Ingest (upstream flows + groundwater)

on:
  schedule:
    - cron: "29 7 * * *"   # daily; the Hydrology API publishes quality-checked daily values
  workflow_dispatch:
    inputs:
      since:
        description: "Backfill from this date (YYYY-MM-DD). Leave empty for a normal incremental run."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Upstream river flows
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python ingest_upstream_flows.py "${{ inputs.since }}"

      - name: Groundwater levels
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python ingest_groundwater.py "${{ inputs.since }}"
