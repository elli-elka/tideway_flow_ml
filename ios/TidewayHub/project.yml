# XcodeGen project definition. On your Mac:
#   brew install xcodegen
#   cd ios/TidewayHub && xcodegen
#   open TidewayHub.xcodeproj
name: TidewayHub
options:
  bundleIdPrefix: com.example.tidewayhub   # change to your own reverse domain
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TidewayHub:
    type: application
    platform: iOS
    sources:
      - path: TidewayHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tidewayhub.app
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Tideway Hub"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shows the wind relative to the stretch of river you're on."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Set your (free) Apple ID team in Xcode > Signing & Capabilities
