# XcodeGen project definition. On your Mac:
#   brew install xcodegen
#   cd ios/TidewayHub && xcodegen
#   open TidewayHub.xcodeproj
name: TidewayHub
options:
  bundleIdPrefix: com.example.tidewayhub   # change to your own reverse domain
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TidewayHub:
    type: application
    platform: iOS
    sources:
      - path: TidewayHub
        excludes:
          - Info.plist
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: TidewayHub/Info.plist     # generated by xcodegen; keys set below
      properties:
        WindyAPIKey: $(WINDY_API_KEY)
        ThamesWaterClientID: $(THAMES_WATER_CLIENT_ID)
        ThamesWaterClientSecret: $(THAMES_WATER_CLIENT_SECRET)
        # Background checks for flag changes and sewage discharges (AlertService)
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.example.tidewayhub.app.refresh]
    dependencies:
      - target: TidewayWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tidewayhub.app
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Tideway Hub"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Shows the wind relative to the stretch of river you're on."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Lets the app notice when you arrive at your home club and show the flag, forecast and next tide on your lock screen. Only used if you turn on Arriving at my club."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        # Set your (free) Apple ID team in Xcode > Signing & Capabilities

  # Home Screen and Lock Screen widget. Shares a few model files with the app.
  TidewayWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TidewayWidget
        excludes:
          - Info.plist
      - path: TidewayHub/Models/Feed.swift
      - path: TidewayHub/Models/FlagColour.swift
      - path: TidewayHub/Models/Time.swift
      - path: TidewayHub/App/Diagnostics.swift
      - path: TidewayHub/Services/FeedService.swift
    info:
      path: TidewayWidget/Info.plist   # generated by xcodegen
      properties:
        CFBundleDisplayName: Tideway Hub
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tidewayhub.app.widget   # must start with the app's identifier
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
